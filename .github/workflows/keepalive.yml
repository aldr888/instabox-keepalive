name: instabox-keepalive

# Keeps an InstaBox free-tier machine awake from outside the sandbox: renews
# the official activity lease, rotates the run before maxRunMinutes, and
# starts the machine again whenever it is suspended.
#
# GitHub's cron scheduler is unreliable for short intervals, so instead of
# trusting each 5-minute tick we run one long job (5h30m, under the 6h job
# limit) that renews the lease every 4 minutes. The cron only keeps a single
# pending run queued: when the running job ends, the pending one starts
# immediately and takes over, so coverage is continuous.
on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: instabox-keepalive
  cancel-in-progress: false

jobs:
  keepalive:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@v4

      - name: Keep the machine awake
        env:
          INSTABOX_API_KEY: ${{ secrets.INSTABOX_API_KEY }}
          INSTABOX_MACHINE_ID: ${{ secrets.INSTABOX_MACHINE_ID }}
        run: |
          end=$((SECONDS + 19800))   # 5h30m
          while [ "$SECONDS" -lt "$end" ]; do
            python3 keepalive.py || true
            sleep 240
          done
