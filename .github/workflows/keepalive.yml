name: instabox-keepalive

# Keeps an InstaBox free-tier machine awake from outside the sandbox:
# renews the official activity lease, rotates the run before maxRunMinutes,
# and starts the machine again whenever it is suspended.
on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: instabox-keepalive
  cancel-in-progress: false

jobs:
  keepalive:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4

      - name: Run keepalive
        env:
          INSTABOX_API_KEY: ${{ secrets.INSTABOX_API_KEY }}
          INSTABOX_MACHINE_ID: ${{ secrets.INSTABOX_MACHINE_ID }}
        run: |
          set +e
          rc=1
          for attempt in 1 2 3; do
            python3 keepalive.py
            rc=$?
            [ "$rc" -eq 0 ] && break
            sleep 20
          done
          exit "$rc"
